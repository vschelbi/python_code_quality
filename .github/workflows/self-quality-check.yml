# .github/workflows/self-quality-check.yml
# This workflow applies the quality checks to this repository itself
# when pull requests are created, ensuring we eat our own dog food.

name: self-quality-check
on:
  pull_request:

jobs:
  python_code_quality:
    runs-on: ubuntu-latest
    
    # Each matrix value becomes an independent job that runs in parallel.
    strategy:
      fail-fast: false
      matrix:
        check: [isort, black, flake8, mypy, pylint]

    steps:
      # -- Setup ------------------------------------------------------------
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install tooling
        run: pip install -r requirements.txt pydantic

      # -- Detect changed *.py files once per job ---------------------------
      - name: Get changed Python files
        id: changed
        uses: tj-actions/changed-files@v46
        with:
          files: |
            *.py
            **/*.py

      # -- Run the selected checker ----------------------------------------
      - name: Run ${{ matrix.check }}
        # Skip the job entirely if no Python file changed
        if: ${{ steps.changed.outputs.any_changed == 'true' }}
        run: |
          FILES='${{ steps.changed.outputs.all_changed_files }}'
          case "${{ matrix.check }}" in
            isort)
              echo "isort …"
              isort --check-only --diff --profile black --line-length 99 $FILES
              ;;
            black)
              echo "black …"
              black --check --line-length 99 $FILES
              ;;
            flake8)
              echo "flake8 …"
              flake8 --max-line-length 100 --extend-ignore=E203 $FILES
              ;;
            mypy)
              echo "mypy …"
              mypy --config-file=mypy-pydantic.ini $FILES
              ;;
            pylint)
              echo "pylint …"
              # Use the local pylintrc file since we don't need to pull external config
              pylint --rcfile .pylintrc $FILES
              ;;
          esac

      # -- Informative no-op step when nothing changed ----------------------
      - name: Nothing to lint – ${{ matrix.check }} skipped
        if: ${{ steps.changed.outputs.any_changed != 'true' }}
        run: echo "No *.py changes detected – skipping ${{ matrix.check }}."
